name: Build TWRP (recovery-as-boot)

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo add-apt-repository -y universe || true
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip python3 python-is-python3 libssl-dev rsync \
            libncurses5 cpio || true
          git config --global user.email "you@example.com"
          git config --global user.name "CI"
          mkdir -p ~/bin
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Set up swap space
        # ubuntu-22.04 runner: 16 GB RAM, root disk only ~14 GB free.
        # Put a 16G swapfile on /mnt (the large volume) so linking-heavy
        # build stages do not OOM or stall the runner.
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 16G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Sync OrangeFox source (fox_12.1)
        run: |
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git ~/foxsync
          mkdir -p ~/twrpsrc && cd ~/twrpsrc
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          # OrangeFox bring-up for the legacy 12.1 branch (same steps the
          # official orangefox_sync.sh performs): patch build system +
          # update_engine + vendor twrp, then swap in fox recovery+vendor.
          cd ~/twrpsrc/build && patch -p1 < ~/foxsync/patches/patch-manifest-fox_12.1.diff
          cd ~/twrpsrc/system/update_engine && patch -p1 < ~/foxsync/patches/patch-update-engine-fox_12.1.diff
          cd ~/twrpsrc/vendor/twrp && patch -p1 < ~/foxsync/patches/patch-vendor-twrp-fox_12.1.diff
          rm -rf ~/twrpsrc/bootable/recovery ~/twrpsrc/vendor/recovery
          git clone --depth=1 -b fox_12.1 https://gitlab.com/OrangeFox/bootable/Recovery.git ~/twrpsrc/bootable/recovery
          git clone --depth=1 -b main https://gitlab.com/OrangeFox/vendor/recovery.git ~/twrpsrc/vendor/recovery
          ls ~/twrpsrc/bootable/recovery/gui/gui.cpp ~/twrpsrc/vendor/recovery
        timeout-minutes: 150

      - name: Install device tree
        run: |
          mkdir -p ~/twrpsrc/device/alps
          cp -r $GITHUB_WORKSPACE ~/twrpsrc/device/alps/ls12_mt8797_wifi_64
          # recovery ramdisk 打包时 root/{vendor,product,system_ext,odm} 符号链接
          # 与安装到 recovery/root 的内容冲突；从 rsync 排除这些顶层符号链接
          # （TWRP 挂载分区无影响）
          sed -i 's|rsync -a --exclude=sdcard|rsync -a --exclude=sdcard --exclude=/root/vendor --exclude=/root/product --exclude=/root/system_ext --exclude=/root/odm|' \
            ~/twrpsrc/build/make/core/Makefile
          grep -n "rsync -a --exclude=sdcard" ~/twrpsrc/build/make/core/Makefile | head -2
          ls -la ~/twrpsrc/device/alps/ls12_mt8797_wifi_64

      - name: Patch TWRP source (device-specific fixes)
        # minuitwrp/events.cpp: this panel's himax driver reports finger-up as
        # ABS_MT_TRACKING_ID -1 followed by zero TOUCH_MAJOR/PRESSURE in the
        # same frame; upstream overwrites the tracking-id release marker, so
        # the GUI never sees a finger-up. No BoardConfig flag can fix this
        # (TW_IGNORE_ABS_MT_TRACKING_ID has no wiring in twrp-12.1), so the
        # fix ships as a patch from this tree. git apply --check makes the
        # build fail loudly if upstream drifts instead of silently skipping.
        run: |
          cd ~/twrpsrc/bootable/recovery
          git apply --check $GITHUB_WORKSPACE/patches/*.patch
          git apply $GITHUB_WORKSPACE/patches/*.patch
          grep -n "touchReleaseOnNextSynReport != 2" minuitwrp/events.cpp

      - name: Patch vold source (recovery-side fixes)
        # Recovery-only fixes for the metadata-decrypt child, applied to the
        # TeamWin fork of system/vold:
        #  - Checkpoint.cpp: pin IBootControl to nullptr. The boot HAL is a
        #    lazy service that cannot start in recovery; the client-side
        #    getService() then retries it once per second forever, which
        #    wedged decryption right before the /data mount (visible as
        #    endless "trying to start it as a lazy HAL" spam until the
        #    wait-timeout fired).
        #  - KeyStorage.cpp: restore the upstream nullopt guard that the
        #    teamwin fork commented out; without it the following deref is
        #    UB whenever begin() succeeded without a key upgrade.
        run: |
          cd ~/twrpsrc/system/vold
          git apply --check $GITHUB_WORKSPACE/patches-vold/*.patch
          git apply $GITHUB_WORKSPACE/patches-vold/*.patch
          grep -n "never query the boot HAL" Checkpoint.cpp | head -4
          grep -n "restore the upstream guard" KeyStorage.cpp
          grep -n "find or create device keyring" KeyUtil.cpp

      - name: Build boot image
        run: |
          cd ~/twrpsrc
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          . build/envsetup.sh
          lunch twrp_ls12_mt8797_wifi_64-eng
          # BOARD_USES_RECOVERY_AS_BOOT: the recoveryimage target is empty and
          # bootimage builds the final TWRP image. The device tree passes the
          # full MTK boot layout (incl. --dtb) via BOARD_MKBOOTIMG_ARGS, so
          # the standard rule produces the flashable image directly — same
          # path any generic TWRP builder action would take.
          mka bootimage -j$(nproc --all)
        timeout-minutes: 150

      - name: Verify & pad boot image
        run: |
          cd ~/twrpsrc
          DT=out/target/product/ls12_mt8797_wifi_64
          ls -la $DT/ | grep -E "boot|ramdisk|recovery"
          cp $DT/boot.img $GITHUB_WORKSPACE/TALIH-PD2-OFRP-Debug.img
          # 运行中镜像实测布局: header v2 携带真实 dtb_size, MTK DTB 容器
          # (d7b7ab1e 魔数, 与 prebuilt/dtb.img 逐字节一致) 摆在标准 v2 dtb
          # 偏移 page*(1+kernel_pages+ramdisk_pages), dtb_addr=0x47c80000。
          # AOSP 规则经 BoardConfig 的 BOARD_MKBOOTIMG_ARGS 已带 --dtb 直出
          # 同款布局; 此处仅做字节校验并填充到 boot 分区大小 64MiB
          # (dd 刷写安全)
          python3 - <<'EOF'
          import os, struct
          ws = os.environ['GITHUB_WORKSPACE']
          src = os.path.join(ws, 'TALIH-PD2-OFRP-Debug.img')
          boot = open(src,'rb').read()
          magic = boot[0:8]
          kernel_size = struct.unpack('<I', boot[8:12])[0]
          ramdisk_size = struct.unpack('<I', boot[16:20])[0]
          page = struct.unpack('<I', boot[36:40])[0]
          dtb_size = struct.unpack('<I', boot[1648:1652])[0]
          dtb_addr = struct.unpack('<Q', boot[1652:1660])[0]
          assert magic == b'ANDROID!', 'bad mkbootimg output'
          kpages = (kernel_size + page - 1)//page
          rpages = (ramdisk_size + page - 1)//page
          dtb_off = page * (1 + kpages + rpages)
          dtb = open(os.path.join(ws, 'prebuilt/dtb.img'),'rb').read()
          assert dtb_size == len(dtb), 'dtb_size mismatch'
          assert boot[dtb_off:dtb_off+dtb_size] == dtb, 'dtb payload mismatch'
          assert dtb_addr == 0x47c80000, 'dtb_addr mismatch'
          part = 67108864
          assert len(boot) <= part, 'image exceeds boot partition'
          out = boot + b'\0' * (part - len(boot))
          open(src,'wb').write(out)
          print(f'verified: kernel={kernel_size} ramdisk={ramdisk_size} dtb={dtb_size} total={len(out)}')
          EOF
          ls -la $GITHUB_WORKSPACE/TALIH-PD2-OFRP-Debug.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TALIH-PD2-OFRP-Debug
          path: |
            TALIH-PD2-OFRP-Debug.img
          retention-days: 14
          if-no-files-found: error
